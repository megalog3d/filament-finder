<header>
  <h1>Regional Filament-Manufacturer Finder</h1>
  <p>Find 3d printing Filament manufacturers near you</p>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Search by name or city...">
  <input type="text" id="materialSearchInput" placeholder="Search materials (e.g. Matt, CF, Wood)...">
  <select id="materialFilter">
    <option value="">All materials</option>
  </select>
  <select id="additiveFilter">
    <option value="">All additives</option>
  </select>
  <select id="specialtyFilter">
    <option value="">All specialties</option>
  </select>
  <select id="sortSelect">
    <option value="default">Sort: Default</option>
    <option value="az">Sort: A–Z</option>
    <option value="distance" disabled>Sort: Nearest to me</option>
  </select>
  <button type="button" id="copyFilterLinkBtn" title="Copy link to this filtered view">
    <span class="material-symbols-outlined">ios_share</span>
  </button>
</div>

<div class="count" id="resultCount"></div>

<div class="disclaimer">Data provided without guarantee — locations, materials, and links may be outdated or inaccurate.</div>

<div class="layout">
  <div id="map"></div>
  <div id="list"></div>
  <div id="alphaIndex"></div>
</div>

<div id="topRightButtons">
  <button id="statsBtn">Stats</button>
  <button id="contactBtn">Suggest a correction</button>
</div>

<div id="statsModal">
  <div id="statsPanel">
    <button type="button" id="statsClose">✕</button>
    <h3 style="margin-top:0;">Filament Finder Stats</h3>
    <div id="statsContent"></div>
  </div>
</div>

<div id="contactModal">
  <form id="contactForm">
    <button type="button" id="contactClose">✕</button>
    <h3 style="margin-top:0;">Suggest a correction</h3>
    <input type="hidden" name="access_key" value="DEIN-ACCESS-KEY-HIER">
    <label>Name<input type="text" name="name"></label>
    <label>Email<input type="email" name="email"></label>
    <label>Message<textarea name="message" rows="4" required></textarea></label>
    <button type="submit">Send</button>
  </form>
</div>

// Country name -> flag emoji. Add more entries as new countries come up.
const countryFlags = {
  "Germany": "🇩🇪",
  "Austria": "🇦🇹",
  "Switzerland": "🇨🇭",
  "Netherlands": "🇳🇱",
  "Czech Republic": "🇨🇿",
  "Spain": "🇪🇸",
  "Slovenia": "🇸🇮",
  "Sweden": "🇸🇪",
  "Poland": "🇵🇱",
  "Italy": "🇮🇹",
  "USA": "🇺🇸",
};

function getFlag(country) {
  return countryFlags[country] || "";
}

// Manufacturers whose "Made in" claim is confirmed and safe to show.
// Everyone else keeps their origin/flag data in the object (not deleted),
// it's just hidden here until double-checked.
const confirmedOriginManufacturers = ["Extrudr", "Prusament by Prusa", "add:north"];

// Renders the "Made in house in <flag>" badge - only for confirmed manufacturers,
// and only if a flag/origin is set at all.
function flagTag(origin, name) {
  const flag = getFlag(origin);
  if (!flag) return "";
  if (!confirmedOriginManufacturers.includes(name)) return "";
  return `<span class="flag-tag">Made in house in ${flag}</span>`;
}

// Maps a raw material name to its base category.
// Returns null if it doesn't clearly fit one (= a "specialty" material).
// Order matters: more specific checks must come first.
function getBaseCategory(material) {
  const m = material.toLowerCase();
  if (m.includes('support') || m.includes('psflex') || m.includes('ps flex')) return 'Support';
  if (m.startsWith('pc/')) return 'PC';
  if (m.includes('petg') || m.includes('pet-g') || m.includes('pctg') || m.includes('pet-cf') || m.includes('pet cf')) return 'PETG';
  if (m.includes('pla')) return 'PLA';
  if (m.includes('asa')) return 'ASA';
  if (m.includes('abs')) return 'ABS';
  if (m.includes('pmma')) return 'PMMA';
  if (m.includes('pps')) return 'PPS';
  if (m.includes('pvb')) return 'PVB';
  if (m.includes('pei')) return 'PEI';
  if (m.includes('pa11') || m.includes('pa12') || m.includes('pa6') || m.includes('nylon') || m.includes(' pa ') || m.startsWith('pa ') || m === 'pa') return 'PA';
  if (m.includes('pc')) return 'PC';
  if (m.includes('paht')) return 'PAHT';

  // Groups all flexible materials (TPU, TPE, TPC, ...) by property instead of by chemistry
  if (m.includes('tpu') || m.includes('tpe') || m.includes('flex')) return 'Flex';
  if (m.includes('hpp')) return 'HPP';
  if (m.includes('pp')) return 'PP';
  if (m.includes('hips')) return 'HIPS';
  if (m.includes('pva')) return 'PVA';
  return null;
}

// Known additive keywords. Only ones actually found in the data
// end up as dropdown options.
const knownAdditives = ["CF", "GF", "FibCR", "Kevlar", "Glow in the dark", "Tungsten", "Magnetite", "Matt", "Tough", "ESD", "REC", "V0"];
// True if the whole material name IS an additive (e.g. "Kevlar") - base unknown.
function isPureAdditive(material) {
  return knownAdditives.some(a => a.toLowerCase() === material.toLowerCase());
}

// Manufacturers whose materials are currently shown (tags + filter dropdowns).
// Add a name here once its material list has been double-checked.
const visibleMaterialManufacturers = ["Extrudr, Prusament by Prusa"];

// Dropdown order: the everyday materials first, exotics further down.
const categoryOrder = ["PLA", "PETG", "ABS", "ASA", "PA", "PAHT", "PC", "Flex",
                       "PP", "PPS", "PMMA", "HPP", "PVA", "Support"];

// Sorts by the given preferred order; anything unlisted goes last, alphabetically.
function sortByPreferred(values, order) {
  return values.sort((a, b) => {
    const ia = order.indexOf(a);
    const ib = order.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

function fillSelect(selectId, values) {
  const select = document.getElementById(selectId);
  values.forEach(v => {
    const option = document.createElement('option');
    option.value = v;
    option.textContent = v;
    select.appendChild(option);
  });
}

function populateMaterialFilter() {
  const categories = new Set();
  herstellerData.filter(item => visibleMaterialManufacturers.includes(item.name)).forEach(item => {
    item.materials.forEach(m => {
      const cat = getBaseCategory(m);
      if (cat) categories.add(cat);
    });
  });
  fillSelect('materialFilter', sortByPreferred(Array.from(categories), categoryOrder));
}

function populateAdditiveFilter() {
  const found = new Set();
  herstellerData.filter(item => visibleMaterialManufacturers.includes(item.name)).forEach(item => {
    item.materials.forEach(m => {
      knownAdditives.forEach(add => {
        if (m.toLowerCase().includes(add.toLowerCase())) found.add(add);
      });
    });
  });
  fillSelect('additiveFilter', sortByPreferred(Array.from(found), knownAdditives));
}

function populateSpecialtyFilter() {
  const specialties = new Set();
  herstellerData.filter(item => visibleMaterialManufacturers.includes(item.name)).forEach(item => {
    item.materials.forEach(m => {
      if (getBaseCategory(m) === null && !isPureAdditive(m)) specialties.add(m);
    });
  });
  fillSelect('specialtyFilter', Array.from(specialties).sort());
}

let userMarker = null;
let userLocation = null;

// Distance between two lat/lng points in km (haversine formula)
function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

document.addEventListener('click', (e) => {
  if (e.target.id !== 'locateBtn') return;
  if (!navigator.geolocation) {
    alert('Geolocation is not supported by your browser.');
    return;
  }
  e.target.textContent = 'Locating...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      userLocation = { lat: latitude, lng: longitude };
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([latitude, longitude], {
        radius: 8,
        color: '#0d556f',
        fillColor: '#0d556f',
        fillOpacity: 0.6
      }).addTo(map).bindPopup('You are here');
      map.setView([latitude, longitude], 9);
      e.target.textContent = '📍 Near me';

      // Distance sort only makes sense once we know where "here" is
      const distanceOption = document.querySelector('#sortSelect option[value="distance"]');
      distanceOption.disabled = false;
      document.getElementById('sortSelect').value = 'distance';
      applyFilters();
    },
    () => {
      alert('Could not determine your location.');
      e.target.textContent = '📍 Near me';
    }
  );
});

const countryCounterControl = L.control({ position: 'bottomleft' });

  div.id = 'countryCounter';
  return div;
};

function updateCountryCounter(data) {
  const counts = {};
  data.forEach(item => {
    if (!item.origin) return;
    counts[item.origin] = (counts[item.origin] || 0) + 1;
  });
  const el = document.getElementById('countryCounter');
  if (!el) return;
  el.textContent = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([country, count]) => `${getFlag(country)} ${count}`)
    .join(' · ');
}

// How many material tags a card shows before collapsing the rest
const TAG_LIMIT = 8;

let markers = [];

function renderMarkersAndList(data) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const list = document.getElementById('list');
  list.innerHTML = '';

  data.forEach(item => {
    const marker = L.marker([item.lat, item.lng]).addTo(map);
    marker.bindPopup(
      `<strong>${item.name}</strong> ${flagTag(item.origin, item.name)}<br>${item.city}${item.description ? '<br>' + item.description : ''}`
    );
    markers.push(marker);

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = item.name;
    card.innerHTML = `
      <h3>${item.name} ${flagTag(item.origin, item.name)}</h3>
      <p>${item.city}</p>
      ${item.description ? `<p>${item.description}</p>` : ''}
      ${item.lastUpdated ? `<p class="last-updated">Last checked: ${item.lastUpdated}</p>` : ''}
      <a href="${item.website}" target="_blank" rel="noopener">${item.website.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')}</a>
      <button type="button" class="share-btn" title="Copy link to this manufacturer" data-share="${item.name}"><span class="material-symbols-outlined">ios_share</span></button>
      ${visibleMaterialManufacturers.includes(item.name) ? `
      <div class="tags">
        ${item.materials.map((m, idx) => {
          const base = getBaseCategory(m);
          const hasAdditive = knownAdditives.some(add => m.toLowerCase().includes(add.toLowerCase()));
          let cls = 'tag';
          if (base === null) {
            cls = isPureAdditive(m) ? 'tag-additive' : 'tag-special';
          } else if (hasAdditive) {
            cls = 'tag-additive';
          }
          if (idx >= TAG_LIMIT) cls += ' extra-tag';
          return `<span class="${cls}">${m}</span>`;
        }).join('')}
        ${item.materials.length > TAG_LIMIT
          ? `<span class="tag-more">+${item.materials.length - TAG_LIMIT} more</span>`
          : ''}
      </div>` : ''}
    `;
    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      const shareBtn = e.target.closest('.share-btn');
      if (shareBtn) {
        const url = `${window.location.origin}${window.location.pathname}?manufacturer=${encodeURIComponent(item.name)}`;
        navigator.clipboard.writeText(url).then(() => {
          const icon = shareBtn.querySelector('.material-symbols-outlined');
          icon.textContent = 'check';
          setTimeout(() => { icon.textContent = 'ios_share'; }, 1200);
        });
        return;
      }
      if (e.target.classList.contains('tag-more')) {
        const tagBox = card.querySelector('.tags');
        tagBox.classList.toggle('expanded');
        e.target.textContent = tagBox.classList.contains('expanded')
          ? 'show less'
          : `+${item.materials.length - TAG_LIMIT} more`;
        return;
      }
      map.setView([item.lat, item.lng], 10);
      marker.openPopup();
    });
    list.appendChild(card);

    // Clicking the marker highlights and scrolls to the matching sidebar card
    marker.on('click', () => {
      document.querySelectorAll('.card.highlighted').forEach(c => c.classList.remove('highlighted'));
      card.classList.add('highlighted');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  document.getElementById('resultCount').textContent =
    `${data.length} manufacturers found`;

  updateCountryCounter(data);
}

function applyFilters() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const materialSearchTerm = document.getElementById('materialSearchInput').value.toLowerCase();
  const material = document.getElementById('materialFilter').value;
  const additive = document.getElementById('additiveFilter').value;
  const specialty = document.getElementById('specialtyFilter').value;

  const filtered = herstellerData.filter(item => {
    const matchesSearch =
      item.name.toLowerCase().includes(searchTerm) ||
      item.city.toLowerCase().includes(searchTerm);

    // Material search, material/additive, and specialty filters only apply
    // to manufacturers whose data has been double-checked (visibleMaterialManufacturers).
    // Everyone else is excluded as soon as any of these filters is active.
    const isVisible = visibleMaterialManufacturers.includes(item.name);

    const matchesMaterialSearch =
      !materialSearchTerm ||
      (isVisible && item.materials.some(m => m.toLowerCase().includes(materialSearchTerm)));

    // Base material and additive must match on the SAME material string,
    // not just "PLA somewhere in the list AND CF somewhere else".
    const matchesMaterialAndAdditive = (!material && !additive) || (isVisible && item.materials.some(m => {
      const matchesBase = !material || getBaseCategory(m) === material;
      const matchesAdd = !additive || m.toLowerCase().includes(additive.toLowerCase());
      return matchesBase && matchesAdd;
    }));

    const matchesSpecialty = !specialty || (isVisible && item.materials.includes(specialty));

    return matchesSearch && matchesMaterialSearch && matchesMaterialAndAdditive && matchesSpecialty;
  });

  const sortMode = document.getElementById('sortSelect').value;
  if (sortMode === 'az') {
    filtered.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sortMode === 'distance' && userLocation) {
    filtered.sort((a, b) =>
      distanceKm(userLocation.lat, userLocation.lng, a.lat, a.lng) -
      distanceKm(userLocation.lat, userLocation.lng, b.lat, b.lng)
    );
  }

  renderMarkersAndList(filtered);
}

document.getElementById('specialtyFilter').addEventListener('change', applyFilters);

// If the page was opened via a shared link (?manufacturer=Name),
// jump straight to that manufacturer's marker and card, and open
// its popup so there's no ambiguity about which one is meant.
const sharedManufacturer = new URLSearchParams(window.location.search).get('manufacturer');
if (sharedManufacturer) {
  const targetIndex = herstellerData.findIndex(item => item.name === sharedManufacturer);
  if (targetIndex !== -1) {
    const target = herstellerData[targetIndex];
    map.setView([target.lat, target.lng], 10);
    const targetMarker = markers[targetIndex];
    if (targetMarker) targetMarker.openPopup();
    const card = document.querySelector(`#list .card[data-name="${CSS.escape(sharedManufacturer)}"]`);
    if (card) {
      card.classList.add('highlighted');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

// A-Z jump index, built once from the letters that actually occur
function buildAlphaIndex() {
  const el = document.getElementById('alphaIndex');
  const letters = Array.from(new Set(
    herstellerData.map(item => item.name.trim().charAt(0).toUpperCase())
  )).sort();
  el.innerHTML = letters.map(l => `<button type="button" data-letter="${l}">${l}</button>`).join('');
}
buildAlphaIndex();

document.getElementById('alphaIndex').addEventListener('click', (e) => {
  const letter = e.target.dataset.letter;
  if (!letter) return;

  const sortSelect = document.getElementById('sortSelect');
  const needsResort = sortSelect.value !== 'az';
  if (needsResort) {
    sortSelect.value = 'az';
    applyFilters();
  }

  // Wait a tick so the (possibly just re-sorted) list has re-rendered
  requestAnimationFrame(() => {
    const card = Array.from(document.querySelectorAll('#list .card'))
      .find(c => (c.dataset.name || '').toUpperCase().startsWith(letter));
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

function buildStats() {
  const total = herstellerData.length;
  const withOrigin = herstellerData.filter(h => h.origin);

  // Country distribution - based on all confirmed origins
  const countryCounts = {};
  withOrigin.forEach(h => {
    countryCounts[h.origin] = (countryCounts[h.origin] || 0) + 1;
  });
  const countryRows = Object.entries(countryCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([country, count]) =>
      `<div class="stats-row"><span>${getFlag(country)} ${country}</span><span>${count}</span></div>`
    ).join('');

  // Material distribution - only from manufacturers with checked material data,
  // so this doesn't imply certainty about the rest of the list.
  const materialCounts = {};
  herstellerData
    .filter(h => visibleMaterialManufacturers.includes(h.name))
    .forEach(h => {
      h.materials.forEach(m => {
        const cat = getBaseCategory(m) || (isPureAdditive(m) ? null : 'Specialty');
        if (cat) materialCounts[cat] = (materialCounts[cat] || 0) + 1;
      });
    });
  const materialRows = Object.entries(materialCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, count]) =>
      `<div class="stats-row"><span>${cat}</span><span>${count}</span></div>`
    ).join('');

  document.getElementById('statsContent').innerHTML = `
    <div class="stats-block">
      <h4>Manufacturers</h4>
      <div class="stats-row"><span>Total listed</span><span>${total}</span></div>
      <div class="stats-row"><span>With confirmed production country</span><span>${withOrigin.length}</span></div>
    </div>
    <div class="stats-block">
      <h4>By country</h4>
      ${countryRows || '<p class="stats-note">No confirmed origins yet.</p>'}
    </div>
    <div class="stats-block">
      <h4>By material category</h4>
      ${materialRows || '<p class="stats-note">No manufacturers with checked material data yet.</p>'}
      <p class="stats-note">Based only on manufacturers whose material list has been double-checked (currently: ${visibleMaterialManufacturers.join(', ') || 'none'}).</p>
    </div>
  `;
}

document.getElementById('statsBtn').addEventListener('click', () => {
  buildStats();
  document.getElementById('statsModal').classList.add('open');
});
document.getElementById('statsClose').addEventListener('click', () => {
  document.getElementById('statsModal').classList.remove('open');
});

document.getElementById('copyFilterLinkBtn').addEventListener('click', (e) => {
  const params = new URLSearchParams();
  const search = document.getElementById('searchInput').value.trim();
  const material = document.getElementById('materialFilter').value;
  const additive = document.getElementById('additiveFilter').value;
  const specialty = document.getElementById('specialtyFilter').value;

  if (search) params.set('search', search);
  if (material) params.set('material', material);
  if (additive) params.set('additive', additive);
  if (specialty) params.set('specialty', specialty);

  const query = params.toString();
  const url = `${window.location.origin}${window.location.pathname}${query ? '?' + query : ''}`;

  navigator.clipboard.writeText(url).then(() => {
    const btn = e.target.closest('#copyFilterLinkBtn');
    const icon = btn.querySelector('.material-symbols-outlined');
    icon.textContent = 'check';
    setTimeout(() => { icon.textContent = 'ios_share'; }, 1200);
  });
});

</script>
