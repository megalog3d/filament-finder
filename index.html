<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regionale Filament-Hersteller Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-gesture-handling/dist/leaflet-gesture-handling.min.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f2ec;
    color: #23231f;
  }
  header {
    background: #1d5c46;
    color: #fff;
    padding: 1.25rem 1.5rem;
  }
  header h1 {
    margin: 0 0 0.25rem 0;
    font-size: 1.4rem;
    font-weight: 600;
  }
  header p {
    margin: 0;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    background: #fff;
    border-bottom: 1px solid #e0ddd3;
  }
  .controls input, .controls select {
    padding: 0.5rem 0.75rem;
    border: 1px solid #ccc8ba;
    border-radius: 6px;
    font-size: 0.9rem;
    background: #fafaf7;
  }
  .controls input[type="text"] {
    flex: 1;
    min-width: 180px;
  }
  .controls select {
    min-width: 140px;
  }
  .layout {
    display: flex;
    flex-wrap: wrap;
  }
  #map {
    flex: 2;
    min-width: 320px;
    height: 560px;
  }
  #list {
    flex: 1;
    min-width: 280px;
    height: 560px;
    overflow-y: auto;
    background: #fff;
    border-left: 1px solid #e0ddd3;
    padding: 0.5rem;
  }
  .card {
    padding: 0.75rem;
    border: 1px solid #e5e2d8;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .card:hover {
    background: #f3f1e8;
  }
  .card h3 {
    margin: 0 0 0.25rem 0;
    font-size: 0.95rem;
  }
  .card p {
    margin: 0.15rem 0;
    font-size: 0.8rem;
    color: #55534c;
  }
  .tags {
    margin-top: 0.4rem;
  }
  .tag {
    display: inline-block;
    background: #e7f2ec;
    color: #1d5c46;
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.25rem;
    margin-top: 0.25rem;
  }
  .count {
    padding: 0.5rem 1.5rem;
    font-size: 0.85rem;
    color: #55534c;
    background: #fff;
  }
</style>
</head>
<body>

<header>
  <h1>Regionale Filament-Hersteller Finder</h1>
  <p>Finde 3D-Druck-Filament-Hersteller in deiner Nähe</p>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Suche nach Name oder Ort...">
  <select id="materialFilter">
    <option value="">Alle Materialien</option>
    <option value="PLA">PLA</option>
    <option value="PETG">PETG</option>
    <option value="ABS">ABS</option>
    <option value="ASA">ASA</option>
    <option value="TPU">TPU</option>
  </select>
  <select id="recyclingFilter">
    <option value="">Recycling: egal</option>
    <option value="yes">Bietet Recycling an</option>
  </select>
</div>

<div class="count" id="resultCount"></div>

<div class="layout">
  <div id="map"></div>
  <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-gesture-handling/dist/leaflet-gesture-handling.min.js"></script>
<script>

// Beispieldaten - ersetze das durch deine echten Hersteller
// (lat/lng, materials als Array, recycling als true/false)
const herstellerData = [
  {
    name: "GreenFil Berlin",
    ort: "Berlin",
    lat: 52.5200,
    lng: 13.4050,
    materials: ["PLA", "PETG"],
    recycling: true,
    website: "https://example.com",
    beschreibung: "Recyceltes PLA aus lokalen Reststoffen."
  },
  {
    name: "Nordfil Hamburg",
    ort: "Hamburg",
    lat: 53.5511,
    lng: 9.9937,
    materials: ["ABS", "ASA"],
    recycling: false,
    website: "https://example.com",
    beschreibung: "Technische Filamente für Industrieanwendungen."
  },
  {
    name: "Bayern Filament Werk",
    ort: "München",
    lat: 48.1351,
    lng: 11.5820,
    materials: ["PLA", "TPU"],
    recycling: true,
    website: "https://example.com",
    beschreibung: "Flexible Materialien, Made in Bayern."
  },
  {
    name: "Rhein-Ruhr Plastics",
    ort: "Köln",
    lat: 50.9375,
    lng: 6.9603,
    materials: ["PETG", "ABS"],
    recycling: false,
    website: "https://example.com",
    beschreibung: "Industriequalität zu fairen Preisen."
  },
  {
    name: "Sachsen 3D Materials",
    ort: "Dresden",
    lat: 51.0504,
    lng: 13.7373,
    materials: ["PLA", "PETG", "ASA"],
    recycling: true,
    website: "https://example.com",
    beschreibung: "Breites Sortiment, Fokus auf Nachhaltigkeit."
  }
];

const map = L.map('map', {
  gestureHandling: true
}).setView([51.1657, 10.4515], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap-Mitwirkende',
  maxZoom: 18
}).addTo(map);

let markers = [];

function renderMarkersAndList(data) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const list = document.getElementById('list');
  list.innerHTML = '';

  data.forEach(item => {
    const marker = L.marker([item.lat, item.lng]).addTo(map);
    marker.bindPopup(
      `<strong>${item.name}</strong><br>${item.ort}<br>${item.materials.join(', ')}`
    );
    markers.push(marker);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${item.name}</h3>
      <p>${item.ort}</p>
      <p>${item.beschreibung}</p>
      <div class="tags">
        ${item.materials.map(m => `<span class="tag">${m}</span>`).join('')}
        ${item.recycling ? '<span class="tag">Recycling</span>' : ''}
      </div>
    `;
    card.addEventListener('click', () => {
      map.setView([item.lat, item.lng], 10);
      marker.openPopup();
    });
    list.appendChild(card);
  });

  document.getElementById('resultCount').textContent =
    `${data.length} Hersteller gefunden`;
}

function applyFilters() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const material = document.getElementById('materialFilter').value;
  const recycling = document.getElementById('recyclingFilter').value;

  const filtered = herstellerData.filter(item => {
    const matchesSearch =
      item.name.toLowerCase().includes(searchTerm) ||
      item.ort.toLowerCase().includes(searchTerm);
    const matchesMaterial = !material || item.materials.includes(material);
    const matchesRecycling = !recycling || item.recycling === true;
    return matchesSearch && matchesMaterial && matchesRecycling;
  });

  renderMarkersAndList(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('materialFilter').addEventListener('change', applyFilters);
document.getElementById('recyclingFilter').addEventListener('change', applyFilters);

renderMarkersAndList(herstellerData);

</script>

</body>
</html>
