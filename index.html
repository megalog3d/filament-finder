<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filament Finder megalog_</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-gesture-handling/dist/leaflet-gesture-handling.min.css" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f2ec;
    color: #23231f;

  }

    background: #0d556f;
    color: #fff;

  }

    margin: 0 0 0.25rem 0;

    font-weight: 600;
  }
  header p {
    margin: 0;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    background: #fff;
    border-bottom: 1px solid #e0ddd3;
  }
  .controls input, .controls select {
    padding: 0.5rem 0.75rem;
    border: 1px solid #ccc8ba;
    border-radius: 6px;
    font-size: 0.9rem;
    background: #fafaf7;
  }
  .controls input[type="text"] {
    flex: 0 1 220px;
    min-width: 160px;
  }
  .controls select {

  }
  #materialFilter {

    color: #a85512;
  }
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  #map {
    flex: 2;
    min-width: 320px;
    min-height: 0;
  }
  #list {
    flex: 1;
    min-width: 280px;
    min-height: 0;
    overflow-y: auto;
    background: #fff;
    border-left: 1px solid #e0ddd3;
    padding: 0.5rem;

  .card {
    padding: 0.75rem;
    border: 1px solid #e5e2d8;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .card:hover {
    background: #f3f1e8;
  }
  .card h3 {
    margin: 0 0 0.25rem 0;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .card p {
    margin: 0.15rem 0;
    font-size: 0.8rem;
    color: #55534c;
  }
  .card a {
    font-size: 0.8rem;
    color: #0d556f;
  }
  .tags {
    margin-top: 0.4rem;
  }
  .tag {
    display: inline-block;
    background: #d5f1f1;
    color: #0d6e6e;
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.25rem;
    margin-top: 0.25rem;
  }
  .tag-special {
    display: inline-block;
    background: #fbe3cc;
    color: #a85512;
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.25rem;
    margin-top: 0.25rem;
  }
  .tag-additive {
    display: inline-block;
    background: #ece2f7;
    color: #6a3fac;
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.25rem;
    margin-top: 0.25rem;
  }
  .extra-tag { display: none; }
  .tags.expanded .extra-tag { display: inline-block; }
  .tag-more {
    display: inline-block;
    font-size: 0.7rem;
    color: #55534c;
    text-decoration: underline;
    cursor: pointer;
    margin-left: 0.25rem;
    margin-top: 0.25rem;
  }
  .flag-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    font-size: 0.7rem;
    line-height: 1;
    padding: 0.2rem 0.4rem;
    border: 1px solid #ccc8ba;
    border-radius: 6px;
    background: #fafaf7;
    color: #55534c;
    font-weight: 400;
  }
  @media (max-width: 700px) {
    html, body { height: auto; }
    .layout { flex-direction: column; overflow: visible; }
    #map { min-height: 320px; }
    #list { max-height: 65vh; border-left: none; border-top: 1px solid #e0ddd3; }
  }
  .count {
    padding: 0.5rem 1.5rem;
    font-size: 0.85rem;
    color: #55534c;
    background: #fff;
  }
</style>
</head>
<body>

    <option value="">All materials</option>
  </select>
  <select id="additiveFilter">

  </select>
  <select id="specialtyFilter">
    <option value="">All specialties</option>

</div>

<div class="count" id="resultCount"></div>

<div class="layout">
  <div id="map"></div>
  <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet-gesture-handling/dist/leaflet-gesture-handling.min.js"></script>

// Country name -> flag emoji. Add more entries as new countries come up.
const countryFlags = {
  "Germany": "🇩🇪",
  "Austria": "🇦🇹",
  "Switzerland": "🇨🇭",
  "Netherlands": "🇳🇱",
  "CZECH REPUBLIC" : "🇨🇿"

};

function getFlag(country) {
  return countryFlags[country] || "";
}

// Renders the "Made in <flag>" badge, or nothing if the origin is unknown.
function flagTag(origin) {
  const flag = getFlag(origin);
  if (!flag) return "";
  return `<span class="flag-tag">Made in ${flag}</span>`;
}

// Maps a raw material name to its base category.
// Returns null if it doesn't clearly fit one (= a "specialty" material).
// Order matters: more specific checks must come first.
function getBaseCategory(material) {
  const m = material.toLowerCase();
  if (m.includes('support') || m.includes('psflex') || m.includes('ps flex')) return 'Support';
  if (m.startsWith('pc/')) return 'PC';
  if (m.includes('petg') || m.includes('pet-g') || m.includes('pctg') || m.includes('pet-cf') || m.includes('pet cf')) return 'PETG';
  if (m.includes('pla')) return 'PLA';
  if (m.includes('asa')) return 'ASA';
  if (m.includes('abs')) return 'ABS';
  if (m.includes('pmma')) return 'PMMA';
  if (m.includes('pps')) return 'PPS';
  if (m.includes('pvb')) return 'PVB';
  if (m.includes('pei')) return 'PEI';
  if (m.includes('pa11') || m.includes('pa12') || m.includes('pa6') || m.includes('nylon') || m.includes(' pa ') || m.startsWith('pa ') || m === 'pa') return 'PA';
  if (m.includes('pc')) return 'PC';
  if (m.includes('paht')) return 'PAHT';
  
  // Groups all flexible materials (TPU, TPE, TPC, ...) by property instead of by chemistry
  if (m.includes('tpu') || m.includes('tpe') || m.includes('flex')) return 'Flex';
  if (m.includes('hpp')) return 'HPP';
  if (m.includes('pp')) return 'PP';
  if (m.includes('hips')) return 'HIPS';
  if (m.includes('pva')) return 'PVA';
  return null;
}

// Known additive keywords. Only ones actually found in the data
// end up as dropdown options.
const knownAdditives = ["CF", "GF", "FibCR", "Kevlar", "Glow in the dark", "Tungsten", "Magnetite", "Matt", "Tough", "ESD", "REC", "V0"];
// True if the whole material name IS an additive (e.g. "Kevlar") - base unknown.
function isPureAdditive(material) {
  return knownAdditives.some(a => a.toLowerCase() === material.toLowerCase());
}

// Dropdown order: the everyday materials first, exotics further down.
const categoryOrder = ["PLA", "PETG", "ABS", "ASA", "PA", "PAHT", "PC", "Flex",
                       "PP", "PPS", "PMMA", "HPP", "PVA", "Support"];

// Sorts by the given preferred order; anything unlisted goes last, alphabetically.
function sortByPreferred(values, order) {
  return values.sort((a, b) => {
    const ia = order.indexOf(a);
    const ib = order.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

function fillSelect(selectId, values) {
  const select = document.getElementById(selectId);
  values.forEach(v => {
    const option = document.createElement('option');
    option.value = v;
    option.textContent = v;
    select.appendChild(option);
  });
}

function populateMaterialFilter() {
  const categories = new Set();
  herstellerData.forEach(item => {
    item.materials.forEach(m => {
      const cat = getBaseCategory(m);
      if (cat) categories.add(cat);
    });
  });
  fillSelect('materialFilter', sortByPreferred(Array.from(categories), categoryOrder));
}

function populateAdditiveFilter() {
  const found = new Set();
  herstellerData.forEach(item => {
    item.materials.forEach(m => {
      knownAdditives.forEach(add => {
        if (m.toLowerCase().includes(add.toLowerCase())) found.add(add);
      });
    });
  });
  fillSelect('additiveFilter', sortByPreferred(Array.from(found), knownAdditives));
}

function populateSpecialtyFilter() {
  const specialties = new Set();
  herstellerData.forEach(item => {
    item.materials.forEach(m => {
      if (getBaseCategory(m) === null && !isPureAdditive(m)) specialties.add(m);
    });
  });
  fillSelect('specialtyFilter', Array.from(specialties).sort());
}

const map = L.map('map', {
  gestureHandling: true
}).setView([50.5, 10.5], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18
}).addTo(map);

// How many material tags a card shows before collapsing the rest
const TAG_LIMIT = 8;

let markers = [];

function renderMarkersAndList(data) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const list = document.getElementById('list');
  list.innerHTML = '';

  data.forEach(item => {
    const marker = L.marker([item.lat, item.lng]).addTo(map);
    marker.bindPopup(
      `<strong>${item.name}</strong> ${flagTag(item.origin)}<br>${item.city}${item.description ? '<br>' + item.description : ''}`
    );
    markers.push(marker);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${item.name} ${flagTag(item.origin)}</h3>
      <p>${item.city}</p>
      ${item.description ? `<p>${item.description}</p>` : ''}
      <a href="${item.website}" target="_blank" rel="noopener">${item.website.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')}</a>
      <div class="tags">
        ${item.materials.map((m, idx) => {
          const base = getBaseCategory(m);
          const hasAdditive = knownAdditives.some(add => m.toLowerCase().includes(add.toLowerCase()));
          let cls = 'tag';
          if (base === null) {
            cls = isPureAdditive(m) ? 'tag-additive' : 'tag-special';
          } else if (hasAdditive) {
            cls = 'tag-additive';
          }
          if (idx >= TAG_LIMIT) cls += ' extra-tag';
          return `<span class="${cls}">${m}</span>`;
        }).join('')}
        ${item.materials.length > TAG_LIMIT
          ? `<span class="tag-more">+${item.materials.length - TAG_LIMIT} more</span>`
          : ''}
      </div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      if (e.target.classList.contains('tag-more')) {
        const tagBox = card.querySelector('.tags');
        tagBox.classList.toggle('expanded');
        e.target.textContent = tagBox.classList.contains('expanded')
          ? 'show less'
          : `+${item.materials.length - TAG_LIMIT} more`;
        return;
      }
      map.setView([item.lat, item.lng], 10);
      marker.openPopup();
    });
    list.appendChild(card);
  });

  document.getElementById('resultCount').textContent =
    `${data.length} manufacturers found`;
}

function applyFilters() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const materialSearchTerm = document.getElementById('materialSearchInput').value.toLowerCase();
  const material = document.getElementById('materialFilter').value;
  const additive = document.getElementById('additiveFilter').value;
  const specialty = document.getElementById('specialtyFilter').value;

  const filtered = herstellerData.filter(item => {
    const matchesSearch =
      item.name.toLowerCase().includes(searchTerm) ||
      item.city.toLowerCase().includes(searchTerm);

    const matchesMaterialSearch =
      !materialSearchTerm ||
      item.materials.some(m => m.toLowerCase().includes(materialSearchTerm));

    // Base material and additive must match on the SAME material string,
    // not just "PLA somewhere in the list AND CF somewhere else".
    const matchesMaterialAndAdditive = item.materials.some(m => {
      const matchesBase = !material || getBaseCategory(m) === material;
      const matchesAdd = !additive || m.toLowerCase().includes(additive.toLowerCase());
      return matchesBase && matchesAdd;
    });

    const matchesSpecialty = !specialty || item.materials.includes(specialty);

    return matchesSearch && matchesMaterialSearch && matchesMaterialAndAdditive && matchesSpecialty;
  });

  renderMarkersAndList(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('materialSearchInput').addEventListener('input', applyFilters);
document.getElementById('materialFilter').addEventListener('change', applyFilters);
document.getElementById('additiveFilter').addEventListener('change', applyFilters);
document.getElementById('specialtyFilter').addEventListener('change', applyFilters);

populateMaterialFilter();
populateAdditiveFilter();
populateSpecialtyFilter();
renderMarkersAndList(herstellerData);

</script>
